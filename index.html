const list=document.getElementById('list'), jump=document.getElementById('jump'), q=document.getElementById('q');
let sess='all';
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(s,term){if(!term)return esc(s);const i=s.toLowerCase().indexOf(term);if(i<0)return esc(s);
return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+term.length))+'</mark>'+esc(s.slice(i+term.length));}
function render(){
  const term=q.value.trim().toLowerCase();
  list.innerHTML=''; jump.innerHTML='';
  let shown=0;
  for(const cat of DATA){
    const ps=cat.papers.filter(p=>(sess==='all'||p.session===sess)&&(!term||p.title.toLowerCase().includes(term)));
    if(!ps.length) continue;
    shown+=ps.length;
    const j=document.createElement('span'); j.className='jchip'; j.textContent=cat.name+' '+ps.length;
    j.onclick=()=>{const d=document.getElementById('cat'+cat.i); d.open=true; d.scrollIntoView({behavior:'smooth',block:'start'});};
    jump.appendChild(j);
    const d=document.createElement('details'); d.id='cat'+cat.i; if(term) d.open=true;
    const sum=document.createElement('summary');
    sum.innerHTML=`<span>${esc(cat.name)}</span><span class="cnt">${ps.length}</span>`;
    d.appendChild(sum);
    const box=document.createElement('div'); box.className='papers';
    for(const p of ps){
      const row=document.createElement('div'); row.className='p';
      const tags=(p.tags||[]).slice(0,3).map(t=>`<span class="stag">${esc(t.replace(/^\S+\s/,''))}</span>`).join('');
      row.innerHTML=`<div class="ptitle"><span class="pid">${esc(p.id)}</span> ${hl(p.title,term)}</div>`+
        `<div class="meta"><span class="sess">${esc(p.slabel)}</span><span>· ${esc(p.time)}</span>${tags}</div>`;
      box.appendChild(row);
    }
    d.appendChild(box); list.appendChild(d);
  }
  if(!shown) list.innerHTML='<div class="empty">No papers match that filter.</div>';
}
document.querySelectorAll('.seg').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.seg').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); sess=b.dataset.s; render();
});
q.addEventListener('input',render);
render();
